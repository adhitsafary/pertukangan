<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard Tukang - MitraTukang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            900: '#78350f',
                        }
                    },
                    boxShadow: {
                        'fintech': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -2px rgba(0, 0, 0, 0.02)',
                        'fintech-hover': '0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 8px 16px -4px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-header {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .pill-tab-active {
            background: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .dark .pill-tab-active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
    </style>
    <script>
        if (localStorage.getItem('mitratukang_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased flex flex-col transition-colors duration-200 selection:bg-blue-500 selection:text-white pb-24 md:pb-10">

    <!-- Top Header -->
    <header class="glass-header bg-white/85 dark:bg-slate-900/85 border-b border-slate-200/80 dark:border-slate-800/80 sticky top-0 z-40 transition-colors duration-200">
        <div class="max-w-4xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-blue-400 flex items-center justify-center text-white text-lg font-black shadow-lg shadow-blue-500/20">
                        <i class="fa-solid fa-trowel-bricks"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="font-extrabold text-base tracking-tight text-slate-900 dark:text-white">Mitra<span class="text-blue-500">Tukang</span></span>
                            <span class="text-[9px] font-black uppercase px-1.5 py-0.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">Mitra</span>
                        </div>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate max-w-[160px] sm:max-w-none">Tukang: <b id="worker-header-name" class="text-slate-800 dark:text-slate-200">Ahmad Supriyadi</b></p>
                    </div>
                </a>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition" title="Toggle Tema">
                    <i class="fa-solid fa-moon theme-toggle-icon text-xs sm:text-sm"></i>
                </button>
                <button onclick="logout()" class="px-3 py-2 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-rose-500/10 hover:text-rose-500 text-slate-600 dark:text-slate-400 text-xs font-bold transition flex items-center gap-1.5 border border-slate-200 dark:border-slate-700" title="Keluar">
                    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                    <span class="hidden sm:inline">Keluar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content (Mobile-First) -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-4 sm:py-6 space-y-5">
        
        <!-- 1. UNIFIED HERO WALLET CARD -->
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-blue-950 to-slate-950 p-5 sm:p-7 text-white shadow-2xl border border-slate-800">
            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none -mr-20 -mt-20"></div>

            <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                <div class="space-y-1.5">
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 inline-flex items-center gap-1">
                            <i class="fa-solid fa-circle-check"></i> Mitra Terverifikasi KYC
                        </span>
                        <span class="text-[10px] text-slate-400">Rating ⭐ 5.0</span>
                    </div>
                    <p class="text-xs text-slate-400 font-medium">Saldo Dompet Bersih (Siap Tarik)</p>
                    <h2 id="worker-wallet-display" class="text-3xl sm:text-4xl font-black text-emerald-400 tracking-tight">Rp0</h2>
                </div>

                <div class="flex items-center gap-3 pt-2 sm:pt-0">
                    <button onclick="openWithdrawModal()" class="flex-1 sm:flex-none px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-money-bill-transfer"></i>
                        <span>Tarik Saldo</span>
                    </button>
                    <button onclick="loadData()" class="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="Refresh">
                        <i class="fa-solid fa-arrows-rotate text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Status Badges -->
            <div class="mt-5 pt-4 border-t border-slate-800/80 grid grid-cols-2 gap-2 text-center text-[10px] text-slate-400">
                <div class="flex items-center justify-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="truncate font-semibold">Geofencing GPS Aktif (&lt;50m)</span>
                </div>
                <div class="flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-blue-400 text-xs"></i>
                    <span class="truncate font-semibold">Auto-Release 24 Jam</span>
                </div>
            </div>
        </div>

        <!-- 2. PILL SEGMENTED TABS (FILTER TUGAS) -->
        <div class="bg-white dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
            <button onclick="setFilterStatus('all')" id="tab-status-all" class="filter-tab pill-tab-active flex-1 min-w-[75px] py-2 rounded-xl text-xs font-bold transition text-center">
                Semua
            </button>
            <button onclick="setFilterStatus('escrow_held')" id="tab-status-escrow_held" class="filter-tab text-slate-600 dark:text-slate-400 flex-1 min-w-[95px] py-2 rounded-xl text-xs font-semibold transition text-center">
                Siap Berangkat
            </button>
            <button onclick="setFilterStatus('in_progress')" id="tab-status-in_progress" class="filter-tab text-slate-600 dark:text-slate-400 flex-1 min-w-[95px] py-2 rounded-xl text-xs font-semibold transition text-center">
                Dikerjakan
            </button>
            <button onclick="setFilterStatus('work_submitted')" id="tab-status-work_submitted" class="filter-tab text-slate-600 dark:text-slate-400 flex-1 min-w-[95px] py-2 rounded-xl text-xs font-semibold transition text-center">
                Review (24h)
            </button>
            <button onclick="setFilterStatus('completed')" id="tab-status-completed" class="filter-tab text-slate-600 dark:text-slate-400 flex-1 min-w-[85px] py-2 rounded-xl text-xs font-semibold transition text-center">
                Selesai
            </button>
        </div>

        <!-- 3. WORKER TASKS FEED (RESPONSIVE CARDS VIEW) -->
        <div class="space-y-3.5" id="worker-orders-feed">
            <!-- Dynamically populated -->
        </div>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-900/95 border-t border-slate-200 dark:border-slate-800 backdrop-blur-lg z-50 px-8 py-2.5 flex items-center justify-between shadow-2xl">
        <a href="/tukang" class="flex flex-col items-center gap-1 text-blue-600 dark:text-blue-400">
            <i class="fa-solid fa-briefcase text-base"></i>
            <span class="text-[10px] font-bold">Tugas</span>
        </a>
        <button onclick="openWithdrawModal()" class="-mt-6 w-12 h-12 rounded-full bg-gradient-to-tr from-emerald-500 to-emerald-400 text-slate-950 flex items-center justify-center shadow-lg shadow-emerald-500/40 text-lg font-black">
            <i class="fa-solid fa-money-bill-transfer"></i>
        </button>
        <a href="/profile" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-blue-500">
            <i class="fa-solid fa-circle-user text-base"></i>
            <span class="text-[10px] font-bold">Profil</span>
        </a>
    </nav>

    <!-- WITHDRAWAL MODAL -->
    <div id="withdraw-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 max-w-sm w-full rounded-3xl p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h4 class="font-extrabold text-slate-900 dark:text-white text-sm flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-transfer text-emerald-500"></i> Tarik Saldo ke Rekening
                </h4>
                <button onclick="closeWithdrawModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleWithdrawSubmit(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Nominal Penarikan (Rp)</label>
                    <input type="number" id="wd-amount" required min="50000" value="100000" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 text-slate-900 dark:text-white font-bold focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Bank / E-Wallet</label>
                        <select id="wd-bank" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-3 py-3 text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-emerald-500">
                            <option value="BCA">Bank BCA</option>
                            <option value="Mandiri">Bank Mandiri</option>
                            <option value="BRI">Bank BRI</option>
                            <option value="BNI">Bank BNI</option>
                            <option value="GoPay">GoPay / OVO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Nomor Rekening</label>
                        <input type="text" id="wd-acc-no" required value="7890123456" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-3 py-3 text-slate-900 dark:text-white font-mono focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/25">
                    <i class="fa-solid fa-paper-plane"></i> Proses Pencairan Dana
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT CONTROLLER -->
    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('mitratukang_theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-toggle-icon').forEach(icon => {
                icon.className = isDark ? 'fa-solid fa-sun theme-toggle-icon text-amber-400 text-xs sm:text-sm' : 'fa-solid fa-moon theme-toggle-icon text-slate-600 text-xs sm:text-sm';
            });
        }
        updateThemeIcons();

        let currentUser = JSON.parse(localStorage.getItem('mitratukang_user')) || {
            id: 2,
            full_name: 'Ahmad Supriyadi',
            role: 'worker',
            wallet_balance: 750000
        };

        document.getElementById('worker-header-name').innerText = currentUser.full_name;
        document.getElementById('worker-wallet-display').innerText = `Rp${Number(currentUser.wallet_balance || 0).toLocaleString('id-ID')}`;

        function logout() {
            localStorage.removeItem('mitratukang_user');
            window.location.href = '/login';
        }

        let allOrders = [];
        let currentFilter = 'all';

        async function loadData() {
            try {
                const res = await fetch(`/api/orders?worker_id=${currentUser.id}`);
                const json = await res.json();
                if (json.success) {
                    allOrders = json.data;
                    renderOrders();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function setFilterStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(t => {
                t.className = 'filter-tab text-slate-600 dark:text-slate-400 flex-1 min-w-[85px] py-2 rounded-xl text-xs font-semibold transition text-center';
            });
            document.getElementById(`tab-status-${status}`).className = 'filter-tab pill-tab-active flex-1 min-w-[85px] py-2 rounded-xl text-xs font-bold transition text-center';
            renderOrders();
        }

        function getStatusBadgeHtml(status) {
            const mapping = {
                'waiting_escrow': '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-500/15 text-amber-700 dark:text-amber-400 border border-amber-500/30">Menunggu Escrow</span>',
                'escrow_held': '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-blue-500/15 text-blue-700 dark:text-blue-400 border border-blue-500/30">Siap Kerja</span>',
                'in_progress': '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-indigo-500/15 text-indigo-700 dark:text-indigo-400 border border-indigo-500/30">Dikerjakan</span>',
                'work_submitted': '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-purple-500/15 text-purple-700 dark:text-purple-400 border border-purple-500/30">Review 24 Jam</span>',
                'completed': '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30">Dana Cair</span>'
            };
            return mapping[status] || `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-200">${status}</span>`;
        }

        function renderOrders() {
            const container = document.getElementById('worker-orders-feed');
            const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl text-center space-y-2 shadow-sm">
                        <i class="fa-solid fa-briefcase text-slate-300 dark:text-slate-700 text-3xl"></i>
                        <p class="font-extrabold text-slate-700 dark:text-slate-300 text-xs">Tidak Ada Tugas di Kategori Ini</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(o => `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 space-y-3.5 shadow-fintech hover:shadow-fintech-hover transition">
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5">
                        <span class="text-[11px] font-mono font-bold text-slate-400">${o.order_code}</span>
                        <div>${getStatusBadgeHtml(o.status)}</div>
                    </div>

                    <div class="space-y-1">
                        <h4 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white leading-snug">${o.title}</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">${o.address}</p>
                    </div>

                    <div class="p-3 bg-slate-50 dark:bg-slate-950 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs flex justify-between items-center">
                        <span class="text-slate-500">Pemberi Kerja: <b class="text-slate-800 dark:text-slate-200">${o.employer_name}</b></span>
                        <span class="text-emerald-600 dark:text-emerald-400 font-black">Upah: Rp${Number(o.base_price * 0.9).toLocaleString('id-ID')}</span>
                    </div>

                    <!-- Photo Before / After if available -->
                    ${(o.photo_before_urls && o.photo_before_urls.length > 0 || o.photo_after_urls && o.photo_after_urls.length > 0) ? `
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            ${o.photo_before_urls && o.photo_before_urls.length > 0 ? `
                                <div>
                                    <span class="text-[9px] font-bold text-slate-500 block mb-0.5">Foto Awal (Before)</span>
                                    <img src="${o.photo_before_urls[0]}" class="w-full h-20 object-cover rounded-xl border border-slate-200 dark:border-slate-800">
                                </div>
                            ` : ''}
                            ${o.photo_after_urls && o.photo_after_urls.length > 0 ? `
                                <div>
                                    <span class="text-[9px] font-bold text-emerald-500 block mb-0.5">Hasil (After)</span>
                                    <img src="${o.photo_after_urls[0]}" class="w-full h-20 object-cover rounded-xl border border-emerald-500/40">
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    <div class="pt-1">
                        ${o.status === 'escrow_held' ? `
                            <button onclick="handleStartWork(${o.id})" class="w-full py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs transition flex items-center justify-center gap-2 shadow-md">
                                <i class="fa-solid fa-location-crosshairs"></i> Validasi Geofence GPS & Mulai Kerja
                            </button>
                        ` : ''}

                        ${o.status === 'in_progress' ? `
                            <button onclick="handleSubmitWork(${o.id})" class="w-full py-3 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white font-black text-xs transition flex items-center justify-center gap-2 shadow-md">
                                <i class="fa-solid fa-camera"></i> Unggah 2 Foto Bukti Selesai (After)
                            </button>
                        ` : ''}

                        ${o.status === 'work_submitted' ? `
                            <div class="p-3 bg-purple-50 dark:bg-purple-950/40 rounded-2xl border border-purple-200 dark:border-purple-800/40 text-center text-xs text-purple-700 dark:text-purple-300 font-bold flex items-center justify-center gap-2">
                                <i class="fa-solid fa-hourglass-half animate-spin"></i> Menunggu review klien atau auto-release 24 jam.
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function handleStartWork(orderId) {
            const res = await fetch(`/api/orders/${orderId}/start-work`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    worker_latitude: -6.917505,
                    worker_longitude: 107.619155,
                    photo_before: ['https://images.unsplash.com/photo-1581858726788-75bc0f6a952d?w=400']
                })
            });
            const json = await res.json();
            alert(json.message);
            loadData();
        }

        async function handleSubmitWork(orderId) {
            const res = await fetch(`/api/orders/${orderId}/submit-work`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    evidence_photos: [
                        'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400',
                        'https://images.unsplash.com/photo-1507652313519-d4e9174996dd?w=400'
                    ],
                    notes: 'Pekerjaan selesai 100% dan terpasang rapi.'
                })
            });
            const json = await res.json();
            alert(json.message);
            loadData();
        }

        function openWithdrawModal() {
            document.getElementById('withdraw-modal').classList.remove('hidden');
        }

        function closeWithdrawModal() {
            document.getElementById('withdraw-modal').classList.add('hidden');
        }

        async function handleWithdrawSubmit(e) {
            e.preventDefault();
            const amount = document.getElementById('wd-amount').value;
            const bank_name = document.getElementById('wd-bank').value;
            const account_number = document.getElementById('wd-acc-no').value;

            const res = await fetch('/api/wallet/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: currentUser.id,
                    amount,
                    bank_name,
                    account_number,
                    account_holder: currentUser.full_name
                })
            });
            const json = await res.json();
            alert(json.message);
            if (json.success) {
                currentUser.wallet_balance = json.remaining_balance;
                localStorage.setItem('mitratukang_user', JSON.stringify(currentUser));
                document.getElementById('worker-wallet-display').innerText = `Rp${Number(json.remaining_balance).toLocaleString('id-ID')}`;
            }
            closeWithdrawModal();
        }

        loadData();
    </script>
</body>
</html>
