<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pendaftaran Akun Baru - MitraTukang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    boxShadow: {
                        'fintech': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -2px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script>
        if (localStorage.getItem('mitratukang_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="h-full flex flex-col justify-center items-center bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 p-4 relative overflow-y-auto transition-colors duration-200">

    <!-- Top Theme Toggle Floating -->
    <div class="absolute top-6 right-6 z-20">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-2xl bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-amber-400 border border-slate-200 dark:border-slate-800 flex items-center justify-center transition shadow-md">
            <i class="fa-solid fa-moon theme-toggle-icon text-sm"></i>
        </button>
    </div>

    <!-- Background Glow Elements -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-lg w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-7 sm:p-8 shadow-2xl space-y-6 relative z-10 backdrop-blur-xl my-8 transition-colors duration-200">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="/" class="inline-block">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 text-2xl font-black mx-auto shadow-lg shadow-amber-500/25">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
            </a>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Daftar Akun Baru</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Verifikasi Langsung Menggunakan Kode OTP Email</p>
        </div>

        <!-- FORM REGISTRATION DENGAN OTP EMAIL -->
        <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-4 text-xs">
            
            <!-- Pilihan Role Akun -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-2">Daftar Sebagai:</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-amber-500 transition has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10">
                        <input type="radio" name="role" value="employer" checked onchange="toggleWorkerFields()" class="text-amber-500 focus:ring-0">
                        <div>
                            <p class="font-extrabold text-slate-900 dark:text-white text-xs">Pencari Tukang (Warga)</p>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">Pemilik hunian / Mandor</p>
                        </div>
                    </label>

                    <label class="p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-500/10">
                        <input type="radio" name="role" value="worker" onchange="toggleWorkerFields()" class="text-blue-500 focus:ring-0">
                        <div>
                            <p class="font-extrabold text-slate-900 dark:text-white text-xs">Mitra Tukang</p>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">Penyedia Jasa Lapangan</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Nama Lengkap -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Nama Lengkap (Sesuai KTP)</label>
                <input type="text" id="reg-name" required placeholder="Cth: Adit Sapari" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-medium">
            </div>

            <!-- Email & Tombol Kirim OTP -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Alamat Email Aktif (Untuk OTP)</label>
                <div class="flex gap-2">
                    <input type="email" id="reg-email" required placeholder="adhitsafary@gmail.com" class="flex-1 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-medium">
                    <button type="button" id="btn-reg-req-otp" onclick="requestRegisterOtp()" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs transition whitespace-nowrap">
                        Kirim OTP
                    </button>
                </div>
                <p id="reg-otp-hint" class="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono mt-1 hidden"></p>
            </div>

            <!-- Input OTP 6 Digit -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Masukkan Kode OTP (6 Digit)</label>
                <input type="text" id="reg-otp-code" required maxlength="6" placeholder="______" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-center text-slate-900 dark:text-white font-mono font-black text-base tracking-widest focus:outline-none focus:border-amber-500">
            </div>

            <!-- Nomor HP / WhatsApp -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">No. WhatsApp</label>
                <input type="tel" id="reg-phone" required placeholder="082123852983" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-medium">
            </div>

            <!-- NIK KTP (Enkripsi UU PDP) -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1 flex items-center justify-between">
                    <span>Nomor NIK KTP</span>
                    <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-normal"><i class="fa-solid fa-lock"></i> Enkripsi AES-256</span>
                </label>
                <input type="password" id="reg-nik" required placeholder="3204xxxxxxxxxxxx" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-mono">
            </div>

            <!-- Khusus Tukang: Kategori Keahlian -->
            <div id="worker-extra-fields" class="hidden space-y-3 p-4 bg-slate-50 dark:bg-slate-950 rounded-2xl border border-slate-200 dark:border-slate-800">
                <p class="font-bold text-amber-600 dark:text-amber-400 text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-briefcase"></i> Data Profil Keahlian Mitra
                </p>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 dark:text-slate-400 font-semibold mb-1">Keahlian Utama</label>
                        <select id="reg-category" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-xs">
                            <option value="batu">Tukang Batu & Keramik</option>
                            <option value="kayu">Tukang Kayu</option>
                            <option value="pipa">Tukang Pipa</option>
                            <option value="listrik">Tukang Listrik</option>
                            <option value="cat">Tukang Cat</option>
                            <option value="las">Tukang Las</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-600 dark:text-slate-400 font-semibold mb-1">Tarif Harian (Rp)</label>
                        <input type="number" id="reg-daily-rate" value="200000" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-xs">
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-submit-reg" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> Verifikasi OTP & Buat Akun MySQL
            </button>
        </form>

        <div class="text-center pt-1">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Sudah memiliki akun? <a href="/login" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">Masuk via OTP Email</a>
            </p>
        </div>

    </div>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('mitratukang_theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-toggle-icon').forEach(icon => {
                icon.className = isDark ? 'fa-solid fa-sun theme-toggle-icon text-amber-400 text-sm' : 'fa-solid fa-moon theme-toggle-icon text-slate-600 text-sm';
            });
        }
        updateThemeIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');
        if (roleParam === 'worker') {
            document.querySelector('input[name="role"][value="worker"]').checked = true;
            toggleWorkerFields();
        }

        function toggleWorkerFields() {
            const isWorker = document.querySelector('input[name="role"]:checked').value === 'worker';
            document.getElementById('worker-extra-fields').classList.toggle('hidden', !isWorker);
        }

        async function requestRegisterOtp() {
            const email = document.getElementById('reg-email').value.trim();
            if (!email) {
                alert('Masukkan alamat email Anda terlebih dahulu.');
                return;
            }

            const btn = document.getElementById('btn-reg-req-otp');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i>';

            try {
                const res = await fetch('/api/auth/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'register' })
                });
                const json = await res.json();

                if (json.success) {
                    const hint = document.getElementById('reg-otp-hint');
                    hint.classList.remove('hidden');
                    hint.innerText = `✅ Kode OTP telah dikirim ke kotak masuk email Anda!`;
                    alert(json.message);
                } else {
                    alert(`❌ ${json.message}`);
                }
            } catch (err) {
                console.error(err);
                alert('Gagal mengirimkan kode OTP.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Kirim OTP';
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-reg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memverifikasi OTP & Mendaftar...';

            const role = document.querySelector('input[name="role"]:checked').value;
            const full_name = document.getElementById('reg-name').value.trim();
            const phone_number = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const nik = document.getElementById('reg-nik').value.trim();
            const otp_code = document.getElementById('reg-otp-code').value.trim();
            const category = document.getElementById('reg-category')?.value;
            const daily_rate = document.getElementById('reg-daily-rate')?.value;

            try {
                const res = await fetch('/api/auth/verify-register-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name,
                        phone_number,
                        email,
                        role,
                        nik,
                        otp_code,
                        category,
                        daily_rate
                    })
                });

                const json = await res.json();

                if (json.success) {
                    localStorage.setItem('mitratukang_user', JSON.stringify(json.data));
                    alert(`✅ Registrasi & Verifikasi OTP Berhasil!\nSelamat datang, ${json.data.full_name}.\nAkun Anda telah aktif di MySQL.`);

                    if (role === 'employer') {
                        window.location.href = '/warga';
                    } else {
                        window.location.href = '/tukang';
                    }
                } else {
                    alert(`❌ Gagal: ${json.message}`);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Verifikasi OTP & Buat Akun MySQL';
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat memproses pendaftaran.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Verifikasi OTP & Buat Akun MySQL';
            }
        }
    </script>
</body>
</html>
