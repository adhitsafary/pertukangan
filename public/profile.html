<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profil Akun - MitraTukang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    boxShadow: {
                        'fintech': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -2px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .glass-header {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
    <script>
        if (localStorage.getItem('mitratukang_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased flex flex-col transition-colors duration-200 pb-20">

    <!-- Top Header -->
    <header class="glass-header bg-white/85 dark:bg-slate-900/85 border-b border-slate-200/80 dark:border-slate-800/80 sticky top-0 z-40 transition-colors duration-200">
        <div class="max-w-xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="goBackDashboard()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center justify-center border border-slate-200 dark:border-slate-700">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>
                <div>
                    <h1 class="font-black text-base text-slate-900 dark:text-white">Profil & Pengaturan Akun</h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400" id="prof-role-badge">Role Pengguna</p>
                </div>
            </div>

            <button onclick="toggleTheme()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400 flex items-center justify-center border border-slate-200 dark:border-slate-700 transition" title="Toggle Tema">
                <i class="fa-solid fa-moon theme-toggle-icon text-xs sm:text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-6 space-y-5">
        
        <!-- User Identity Card -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-fintech text-center space-y-4 relative overflow-hidden">
            <div class="relative inline-block">
                <img id="prof-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-24 h-24 rounded-3xl object-cover border-4 border-amber-500 shadow-xl mx-auto">
                <span class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-900 flex items-center justify-center text-white text-[10px]">
                    <i class="fa-solid fa-check"></i>
                </span>
            </div>

            <div>
                <h2 id="prof-fullname" class="text-xl font-black text-slate-900 dark:text-white">Adit Sapari</h2>
                <p id="prof-email" class="text-xs text-slate-500 dark:text-slate-400">adhitsafary@gmail.com</p>
                <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-extrabold bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">
                    <i class="fa-solid fa-shield-halved"></i> KYC KTP Terverifikasi (UU PDP)
                </div>
            </div>
        </div>

        <!-- Form Edit Profil -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-fintech space-y-4">
            <h3 class="text-sm font-black text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-user-pen text-amber-500"></i> Edit Informasi Pribadi
            </h3>

            <form onsubmit="handleUpdateProfile(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Nama Lengkap</label>
                    <input type="text" id="input-fullname" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="input-phone" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Email</label>
                    <input type="email" id="input-email" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-amber-500">
                </div>

                <!-- Field NIK Terproteksi -->
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1 flex items-center justify-between">
                        <span>Nomor NIK KTP (Enkripsi AES-256)</span>
                        <span class="text-emerald-500 font-normal"><i class="fa-solid fa-lock"></i> Terproteksi UU PDP</span>
                    </label>
                    <input type="text" id="input-nik" disabled class="w-full bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-slate-500 font-mono">
                </div>

                <!-- Khusus Tukang -->
                <div id="worker-profile-fields" class="hidden space-y-3 pt-2">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Kategori Tukang</label>
                            <select id="input-category" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-3 py-3 text-slate-900 dark:text-white font-semibold">
                                <option value="batu">Batu & Keramik</option>
                                <option value="kayu">Kayu & Plafon</option>
                                <option value="pipa">Pipa / Sanitasi</option>
                                <option value="listrik">Listrik & MCB</option>
                                <option value="cat">Cat & Waterproofing</option>
                                <option value="las">Las & Kanopi</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1">Tarif Harian (Rp)</label>
                            <input type="number" id="input-rate" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 text-slate-900 dark:text-white font-bold">
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-save-prof" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan Profil
                </button>
            </form>
        </div>

        <!-- Danger Zone (Keluar) -->
        <div class="pt-2 text-center">
            <button onclick="logout()" class="text-xs font-bold text-rose-500 hover:underline flex items-center justify-center gap-1.5 mx-auto">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar dari Sesi Ini
            </button>
        </div>

    </main>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('mitratukang_theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-toggle-icon').forEach(icon => {
                icon.className = isDark ? 'fa-solid fa-sun theme-toggle-icon text-amber-400 text-xs sm:text-sm' : 'fa-solid fa-moon theme-toggle-icon text-slate-600 text-xs sm:text-sm';
            });
        }
        updateThemeIcons();

        let currentUser = JSON.parse(localStorage.getItem('mitratukang_user')) || {
            id: 1,
            full_name: 'Budi Santoso (Klien)',
            role: 'employer'
        };

        function goBackDashboard() {
            if (currentUser.role === 'employer') window.location.href = '/warga';
            else if (currentUser.role === 'worker') window.location.href = '/tukang';
            else if (currentUser.role === 'admin') window.location.href = '/admin';
            else window.location.href = '/';
        }

        function logout() {
            localStorage.removeItem('mitratukang_user');
            window.location.href = '/login';
        }

        async function loadProfile() {
            try {
                const res = await fetch(`/api/auth/profile/${currentUser.id}`);
                const json = await res.json();

                if (json.success) {
                    const u = json.data;
                    document.getElementById('prof-fullname').innerText = u.full_name;
                    document.getElementById('prof-email').innerText = u.email || u.phone_number;
                    document.getElementById('prof-avatar').src = u.avatar_url;
                    document.getElementById('prof-role-badge').innerText = `Role: ${u.role.toUpperCase()}`;

                    document.getElementById('input-fullname').value = u.full_name;
                    document.getElementById('input-phone').value = u.phone_number;
                    document.getElementById('input-email').value = u.email || '';
                    document.getElementById('input-nik').value = u.nik || '3204******0001';

                    if (u.role === 'worker') {
                        document.getElementById('worker-profile-fields').classList.remove('hidden');
                        document.getElementById('input-category').value = u.category || 'batu';
                        document.getElementById('input-rate').value = u.daily_rate || 200000;
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-prof');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan ke MySQL...';

            const full_name = document.getElementById('input-fullname').value.trim();
            const phone_number = document.getElementById('input-phone').value.trim();
            const email = document.getElementById('input-email').value.trim();
            const category = document.getElementById('input-category')?.value;
            const daily_rate = document.getElementById('input-rate')?.value;

            try {
                const res = await fetch(`/api/auth/profile/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name,
                        phone_number,
                        email,
                        category,
                        daily_rate
                    })
                });
                const json = await res.json();

                if (json.success) {
                    currentUser = { ...currentUser, ...json.data };
                    localStorage.setItem('mitratukang_user', JSON.stringify(currentUser));
                    alert('✅ Profil berhasil diperbarui di database MySQL!');
                    loadProfile();
                } else {
                    alert('❌ Gagal memperbarui: ' + json.message);
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan koneksi.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan Profil';
            }
        }

        loadProfile();
    </script>
</body>
</html>
