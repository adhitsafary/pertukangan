<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Masuk - MitraTukang Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script>
        if (localStorage.getItem('mitratukang_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="h-full flex flex-col justify-center items-center bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 p-4 relative overflow-y-auto transition-colors duration-200">

    <!-- Top Theme Toggle Floating -->
    <div class="absolute top-6 right-6 z-20">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-2xl bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-amber-400 border border-slate-200 dark:border-slate-800 flex items-center justify-center transition shadow-md">
            <i class="fa-solid fa-moon theme-toggle-icon text-sm"></i>
        </button>
    </div>

    <!-- Background Glow Elements -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 relative z-10 backdrop-blur-xl transition-colors duration-200 my-8">
        
        <!-- Logo & Branding -->
        <div class="text-center space-y-2">
            <a href="/" class="inline-block">
                <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 text-3xl font-black mx-auto shadow-xl shadow-amber-500/30">
                    <i class="fa-solid fa-helmet-safety"></i>
                </div>
            </a>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Mitra<span class="text-amber-500">Tukang</span></h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Masuk ke Akun Anda untuk Mengakses Dashboard</p>
        </div>

        <!-- Form Login Standar -->
        <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
            
            <!-- Email / Username / Phone -->
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1.5">
                    Email atau No. Handphone
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="login-identifier" required placeholder="budi.klien@gmail.com / 081234567890" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl pl-10 pr-3.5 py-3 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-medium">
                </div>
            </div>

            <!-- Password -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-slate-700 dark:text-slate-300 font-bold">Password</label>
                    <a href="#" onclick="alert('Default password akun demo: 123456')" class="text-amber-600 dark:text-amber-400 hover:underline text-[11px]">Lupa sandi?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="login-password" required value="123456" placeholder="Masukkan password" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl pl-10 pr-10 py-3 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-medium">
                    <button type="button" onclick="togglePassVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                        <i id="pass-eye-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/25 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk Sekarang
            </button>
        </form>

        <!-- Quick Demo Account Fillers -->
        <div class="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-2">
            <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 text-center uppercase tracking-wider">
                ⚡ Akun Demo Siap Pakai:
            </p>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="fillDemo('budi.klien@gmail.com', '123456')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-amber-500 text-[11px] text-center transition">
                    <p class="font-extrabold text-amber-600 dark:text-amber-400">Warga</p>
                    <p class="text-[9px] text-slate-400">budi.klien</p>
                </button>
                <button onclick="fillDemo('ahmad.tukang@gmail.com', '123456')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-blue-500 text-[11px] text-center transition">
                    <p class="font-extrabold text-blue-600 dark:text-blue-400">Tukang</p>
                    <p class="text-[9px] text-slate-400">ahmad.tukang</p>
                </button>
                <button onclick="fillDemo('admin@mitratukang.id', '123456')" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-emerald-500 text-[11px] text-center transition">
                    <p class="font-extrabold text-emerald-600 dark:text-emerald-400">Admin</p>
                    <p class="text-[9px] text-slate-400">admin@mitra</p>
                </button>
            </div>
        </div>

        <div class="text-center pt-1">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Belum memiliki akun? <a href="/register" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">Daftar Akun Baru</a>
            </p>
        </div>

    </div>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('mitratukang_theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-toggle-icon').forEach(icon => {
                icon.className = isDark ? 'fa-solid fa-sun theme-toggle-icon text-amber-400 text-sm' : 'fa-solid fa-moon theme-toggle-icon text-slate-600 text-sm';
            });
        }
        updateThemeIcons();

        function togglePassVisibility() {
            const passInput = document.getElementById('login-password');
            const eyeIcon = document.getElementById('pass-eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        function fillDemo(identifier, password) {
            document.getElementById('login-identifier').value = identifier;
            document.getElementById('login-password').value = password;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const json = await res.json();

                if (json.success) {
                    // Simpan session info
                    localStorage.setItem('mitratukang_user', JSON.stringify(json.data));
                    alert(`✅ Login Berhasil!\nSelamat datang, ${json.data.full_name} (${json.data.role.toUpperCase()}).\n\nMengalihkan ke dashboard...`);
                    
                    if (json.data.role === 'employer') {
                        window.location.href = '/warga';
                    } else if (json.data.role === 'worker') {
                        window.location.href = '/tukang';
                    } else if (json.data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    alert(`❌ Gagal Masuk: ${json.message}`);
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat memproses login.');
            }
        }
    </script>
</body>
</html>
