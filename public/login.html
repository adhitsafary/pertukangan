<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login Masuk - MitraTukang Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    boxShadow: {
                        'fintech': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -2px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script>
        if (localStorage.getItem('mitratukang_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="h-full flex flex-col justify-center items-center bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 p-4 relative overflow-y-auto transition-colors duration-200">

    <!-- Top Theme Toggle Floating -->
    <div class="absolute top-6 right-6 z-20">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-2xl bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-amber-400 border border-slate-200 dark:border-slate-800 flex items-center justify-center transition shadow-md">
            <i class="fa-solid fa-moon theme-toggle-icon text-sm"></i>
        </button>
    </div>

    <!-- Background Glow Elements -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-7 sm:p-8 shadow-2xl space-y-6 relative z-10 backdrop-blur-xl transition-colors duration-200 my-8">
        
        <!-- Logo & Branding -->
        <div class="text-center space-y-2">
            <a href="/" class="inline-block">
                <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 text-3xl font-black mx-auto shadow-xl shadow-amber-500/30">
                    <i class="fa-solid fa-helmet-safety"></i>
                </div>
            </a>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Mitra<span class="text-amber-500">Tukang</span></h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Masuk Cepat & Aman Menggunakan Verifikasi OTP Email</p>
        </div>

        <!-- STEP 1: FORM INPUT EMAIL UNTUK REQUEST OTP -->
        <div id="step-email-container" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1.5">
                    Alamat Email Terdaftar
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="login-email" required placeholder="Masukkan email terdaftar Anda" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl pl-10 pr-3.5 py-3 text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <button type="button" id="btn-request-otp" onclick="handleRequestOtp()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/25 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Kirim Kode OTP ke Email Saya
            </button>
        </div>

        <!-- STEP 2: FORM INPUT 6-DIGIT OTP (HIDDEN AWAL) -->
        <div id="step-otp-container" class="hidden space-y-4 text-xs">
            <div class="p-3.5 bg-amber-50 dark:bg-amber-950/40 rounded-2xl border border-amber-200 dark:border-amber-800/40 text-center space-y-1">
                <p class="text-xs text-amber-800 dark:text-amber-300 font-bold">Kode OTP 6-Digit Telah Dikirim</p>
                <p class="text-[11px] text-slate-500 dark:text-slate-400" id="txt-otp-sent-target">ke email Anda</p>
                <p class="text-[10px] text-slate-400 mt-1">Silakan cek inbox atau folder spam email Anda.</p>
            </div>

            <div>
                <label class="block text-slate-700 dark:text-slate-300 font-bold mb-1.5 text-center">
                    Masukkan Kode OTP (6 Digit)
                </label>
                <input type="text" id="login-otp" maxlength="6" required placeholder="______" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl py-3 text-center text-slate-900 dark:text-white text-xl font-black font-mono tracking-widest focus:outline-none focus:border-amber-500">
            </div>

            <button type="button" id="btn-verify-otp" onclick="handleVerifyOtp()" class="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-lg shadow-emerald-500/25 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check"></i> Verifikasi OTP & Masuk Dashboard
            </button>

            <div class="flex justify-between items-center pt-1 text-[11px]">
                <button type="button" onclick="resetEmailForm()" class="text-slate-500 hover:text-slate-800 dark:hover:text-white">
                    ← Ganti Email
                </button>
                <button type="button" onclick="handleRequestOtp()" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">
                    Kirim Ulang Kode OTP
                </button>
            </div>
        </div>

        <div class="text-center pt-1">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Belum memiliki akun? <a href="/register" class="text-amber-600 dark:text-amber-400 font-bold hover:underline">Daftar Akun Baru</a>
            </p>
        </div>

    </div>

    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('mitratukang_theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.theme-toggle-icon').forEach(icon => {
                icon.className = isDark ? 'fa-solid fa-sun theme-toggle-icon text-amber-400 text-sm' : 'fa-solid fa-moon theme-toggle-icon text-slate-600 text-sm';
            });
        }
        updateThemeIcons();

        function resetEmailForm() {
            document.getElementById('step-email-container').classList.remove('hidden');
            document.getElementById('step-otp-container').classList.add('hidden');
        }

        async function handleRequestOtp() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                alert('Silakan masukkan alamat email terlebih dahulu.');
                return;
            }

            const btn = document.getElementById('btn-request-otp');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Mengirim OTP ke Email...';

            try {
                const res = await fetch('/api/auth/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'login' })
                });
                const json = await res.json();

                if (json.success) {
                    document.getElementById('step-email-container').classList.add('hidden');
                    document.getElementById('step-otp-container').classList.remove('hidden');
                    document.getElementById('txt-otp-sent-target').innerText = `ke ${email}`;
                    if (json.otp_code) {
                        document.getElementById('login-otp').value = json.otp_code;
                        alert(`Kode OTP 6-Digit: ${json.otp_code}\n\n${json.message}`);
                    }
                } else {
                    alert(`❌ ${json.message}`);
                }
            } catch (err) {
                console.error(err);
                alert('Gagal menghubungi server untuk mengirim OTP.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Kode OTP ke Email Saya';
            }
        }

        async function handleVerifyOtp() {
            const email = document.getElementById('login-email').value.trim();
            const otp_code = document.getElementById('login-otp').value.trim();

            if (!otp_code) {
                alert('Silakan masukkan 6-digit kode OTP.');
                return;
            }

            const btn = document.getElementById('btn-verify-otp');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memverifikasi OTP...';

            try {
                const res = await fetch('/api/auth/verify-login-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp_code })
                });
                const json = await res.json();

                if (json.success) {
                    localStorage.setItem('mitratukang_user', JSON.stringify(json.data));
                    alert(`✅ Verifikasi Berhasil!\nSelamat datang, ${json.data.full_name}.\n\nMengalihkan ke portal Anda...`);

                    if (json.data.role === 'employer') {
                        window.location.href = '/warga';
                    } else if (json.data.role === 'worker') {
                        window.location.href = '/tukang';
                    } else if (json.data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    alert(`❌ ${json.message}`);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Verifikasi OTP & Masuk Dashboard';
                }
            } catch (err) {
                console.error(err);
                alert('Gagal memverifikasi OTP.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Verifikasi OTP & Masuk Dashboard';
            }
        }
    </script>
</body>
</html>
